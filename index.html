<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Эмодзи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h2>🎨 Конструктор Эмодзи</h2>
            <p>Настройте свой уникальный эмодзи</p>
        </header>

        <div class="card">
            <label for="template-select">📦 Выберите шаблон:</label>
            <select id="template-select">
                <option value="1">⭐ Классический шаблон (Звезда)</option>
                <option value="2">🔥 Неоновый шаблон (Огонь)</option>
            </select>
        </div>

        <div class="card">
            <label for="emoji-text">✍️ Текст для эмодзи:</label>
            <input type="text" id="emoji-text" placeholder="Например: VIP" maxlength="5">
        </div>

        <div class="card">
            <label for="emoji-color">🎨 Цвет заливки:</label>
            <div class="color-picker-wrapper">
                <input type="color" id="emoji-color" value="#FF69B4">
                <span id="color-hex">#FF69B4</span>
            </div>
        </div>

        <button id="submit-btn" class="primary-btn">Создать и отправить</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
