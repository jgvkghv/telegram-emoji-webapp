<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Эмодзи</title>
    <link rel="stylesheet" href="style.css">
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h2>🎨 Настройка эмодзи</h2>
        
        <label for="emoji-text">Введите текст (A-Z):</label>
        <input type="text" id="emoji-text" placeholder="Например: VIP" maxlength="5">

        <label for="emoji-color">Выберите цвет заливки:</label>
        <input type="color" id="emoji-color" value="#FF69B4">

        <button id="save-btn">Создать и отправить в бота</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
